# Trial budget for the existing 2-vCPU/6-GB shared VPS. Measure before increasing.
# This watermark throttles publishing; the container limit separately caps memory.
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 2GB
heartbeat = 30
# Long exports must not run forever; finalize worker deadlines before enabling consumers.
consumer_timeout = 3600000

# This bootstrap account is scoped to one vhost and the file-job resource namespace.
# Verify effective tags and permissions after the first boot, including restored volumes.
default_user_tags.management = true
default_permissions.configure = ^sqb[.]filejobs[.].*
default_permissions.write = ^sqb[.]filejobs[.].*
default_permissions.read = ^sqb[.]filejobs[.].*

log.console = true
log.console.level = info
log.file = false
