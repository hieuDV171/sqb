name: Deploy SQB Production Stack

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      services:
        description: Compose services to apply (space-separated, blank applies the whole stack)
        type: string
      backend_image:
        description: Optional BE image by digest (defaults to deployed image)
        type: string
      aisidecar_image:
        description: Optional AISidecar GHCR :latest reference to pull (defaults to the running image)
        type: string

permissions:
  contents: read

concurrency:
  group: sqb-production-stack
  queue: max

jobs:
  changes:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      aisidecar: ${{ steps.detect.outputs.aisidecar }}
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected production components
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/production-changes.sh "$BEFORE" "$GITHUB_SHA"

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-production-image.yml
    with:
      service: backend

  build-aisidecar:
    needs: changes
    if: needs.changes.outputs.aisidecar == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-production-image.yml
    with:
      service: aisidecar

  deploy-backend:
    needs: [changes, build-backend]
    if: needs.changes.outputs.stack == 'false' && needs.changes.outputs.aisidecar == 'false' && needs.build-backend.result == 'success'
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: backend
      backend_image: ${{ needs.build-backend.outputs.image }}
    secrets: inherit

  deploy-aisidecar:
    needs: [changes, build-aisidecar]
    if: needs.changes.outputs.stack == 'false' && needs.changes.outputs.backend == 'false' && needs.build-aisidecar.result == 'success'
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: aisidecar
      aisidecar_image: ${{ needs.build-aisidecar.outputs.image }}
    secrets: inherit

  deploy-stack:
    needs: [changes, build-backend, build-aisidecar]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.stack == 'true' ||
       (needs.changes.outputs.backend == 'true' && needs.changes.outputs.aisidecar == 'true')) &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-aisidecar.result == 'success' || needs.build-aisidecar.result == 'skipped') }}
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: stack
      services: ${{ needs.changes.outputs.stack == 'false' && 'aisidecar backend' || '' }}
      backend_image: ${{ needs.build-backend.outputs.image }}
      aisidecar_image: ${{ needs.build-aisidecar.outputs.image }}
      use_applied_env: true
    secrets: inherit

  deploy-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: stack
      services: ${{ inputs.services }}
      backend_image: ${{ inputs.backend_image }}
      aisidecar_image: ${{ inputs.aisidecar_image }}
    secrets: inherit
