name: Build and Deploy SQB Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing the image
        type: boolean
        default: true

concurrency:
  group: sqb-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-production-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: backend

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy)
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: backend
      backend_image: ${{ needs.build.outputs.image }}
    secrets: inherit
