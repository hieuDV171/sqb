name: Build SQB Production Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    outputs:
      image:
        description: Immutable GHCR image reference
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.repository }}@${{ steps.publish.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image repository
        id: metadata
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            backend|ai-sidecar) ;;
            *) exit 1 ;;
          esac
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sqb-$SERVICE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service }}
          file: ./${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.metadata.outputs.repository }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', steps.metadata.outputs.repository) || '' }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=max
