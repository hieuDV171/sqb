name: Build and Deploy SQB AISidecar

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing the image
        type: boolean
        default: true

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'sqb-production-stack' || format('sqb-aisidecar-{0}', github.ref) }}
  queue: max

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-production-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: aisidecar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && inputs.deploy
    uses: ./.github/workflows/deploy-production.yml
    with:
      target: aisidecar
      aisidecar_image: ${{ needs.build.outputs.image }}
    secrets: inherit
