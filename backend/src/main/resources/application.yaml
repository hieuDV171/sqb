spring:
  application:
    name: sqb-backend
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        show_sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000 # 24 hours // TODO: Sửa 15 phút khi lên production
  refresh-token-expiration: 604800000 # 7 days
  issuer: backend # bên phát hành token

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket-name: ${R2_BUCKET}
  region: ${R2_REGION:auto}
  public-url: ${R2_PUBLIC_URL}

app:
  admin:
    password: ${ADMIN_PASSWORD}
  security:
    default-user-password: ${DEFAULT_USER_PASSWORD}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}
    
  ai-server:
    url: ${AI_SERVER_URL}
    model: ${AI_MODEL}
  salt: ${SECRET_SALT}
  cookie:
    secure: false
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600

logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z', UTC"
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

# AI Sidecar service configuration (Embeddings & BTProp Hallucination Checker)
ai:
  sidecar:
    url: ${AI_SIDECAR_URL:http://localhost:8000}
    timeout: 45000  # 45 seconds for BTProp belief tree calculations

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

elasticsearch:
  host: ${ELASTICSEARCH_HOST}
  port: ${ELASTICSEARCH_PORT}

# Actuator & Observability configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

