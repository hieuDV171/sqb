plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.frozenheart'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Security fixes not yet included in the Spring Boot 4.0.10 BOM.
// Override whole managed families so their modules stay on compatible versions.
ext['commons-codec.version'] = '1.23.0' // CVE-2026-119078
ext['httpclient5.version'] = '5.6.5' // CVE-2026-71290, CVE-2026-64607
ext['httpcore5.version'] = '5.4.4' // CVE-2026-54428, CVE-2026-54399; matches HttpClient 5.6.5
ext['opentelemetry.version'] = '1.68.0' // CVE-2026-45292, CVE-2026-118259

dependencies {
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    constraints {
        add('implementation', 'com.google.guava:guava:33.8.0-jre') {
            because 'CVE-2026-118042: hash-flooding protection'
        }
        add('implementation', 'org.bouncycastle:bcprov-jdk18on:1.87') {
            because 'CVE-2026-8763, CVE-2026-59650, CVE-2026-58062'
        }
        add('implementation', 'org.xerial.snappy:snappy-java:1.1.10.12') {
            because 'CVE-2026-90559, CVE-2026-116590: native buffer range validation'
        }
        add('implementation', 'org.apache.xmlgraphics:batik-bridge:1.20') {
            because 'CVE-2026-111792, CVE-2026-89326, CVE-2026-49236'
        }
        add('implementation', 'org.apache.xmlgraphics:batik-dom:1.20') {
            because 'CVE-2026-90993: XML document validation'
        }
        add('implementation', 'org.apache.xmlgraphics:batik-util:1.20') {
            because 'CVE-2026-44929: external resource validation'
        }
    }

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // cache + redis
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // liquibase
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Actuator health/info cho healthcheck và chẩn đoán vận hành nội bộ
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // mapstruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // MinIO
    implementation 'io.minio:minio:9.0.3'

    // Redisson
    implementation('org.redisson:redisson-spring-boot-starter:4.7.0') {
        exclude group: 'org.redisson', module: 'redisson-spring-data-41'
    }
    // Match Spring Data Redis 4.0.x managed by Spring Boot 4.0.x.
    implementation 'org.redisson:redisson-spring-data-40:4.7.0'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Lombok - Mapstruct Binding
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // MsgPack
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.12'

    // pgvector
    implementation 'com.pgvector:pgvector:0.1.6'

    // vector
    implementation 'org.hibernate.orm:hibernate-vector'

    // hashids
    implementation 'org.hashids:hashids:1.0.3'

    // JasperReports & Excel POI
    implementation 'net.sf.jasperreports:jasperreports:7.0.8'
    implementation('net.sf.jasperreports:jasperreports-pdf:7.0.8') {
        exclude group: 'com.github.librepdf', module: 'openpdf'
    }
    // JasperReports 7.0.8 supports stock OpenPDF for standard PDF exports.
    implementation 'com.github.librepdf:openpdf:1.3.43'
    runtimeOnly 'net.sf.jasperreports:jasperreports-fonts:7.0.8'
    runtimeOnly 'net.sf.jasperreports:jasperreports-jdt:7.0.8'
    runtimeOnly 'org.eclipse.jdt:ecj:3.44.0'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // Elasticsearch Java Client
    implementation 'co.elastic.clients:elasticsearch-java:9.5.2'
    implementation 'org.elasticsearch.client:elasticsearch-rest-client:9.5.2'

    // Thư viện chuẩn JSON-P
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    implementation 'org.eclipse.parsson:parsson:1.1.9'

    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.10.0'

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', 'dev'
    systemProperty 'spring.output.ansi.enabled', 'always'
    systemProperty 'file.encoding', 'UTF-8'

    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
    ]

    // Tự động load tất cả biến môi trường từ file .env
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                value = value.trim().replaceAll('^["\']|["\']$', '')
                environment key.trim(), value
            }
        }
    }
}


