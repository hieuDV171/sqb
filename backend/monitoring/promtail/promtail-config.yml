server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sqb-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: sqb-backend
          application: sqb-backend
          environment: development
          __path__: /var/log/sqb*/*.log

    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<time>\S+)\s+(?P<level>\S+)\s+\[trace:(?P<traceId>[^\]]*)\]\s+\[user:(?P<userId>[^\]]*)\]\s+\[(?P<thread>[^\]]+)\]\s+(?P<logger>\S+)\s+:\s+(?P<message>.*)$'
      - labels:
          level:
          traceId:
          userId:
