<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học viện SQB</title>
    <meta name="description" content="Ngân hàng câu hỏi và cộng đồng học tập. Cùng ôn luyện theo môn, chia sẻ tài liệu và trao đổi với bạn học." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Học viện SQB" />
    <meta property="og:title" content="Học viện SQB" />
    <meta property="og:description" content="Ngân hàng câu hỏi và cộng đồng học tập. Cùng ôn luyện theo môn, chia sẻ tài liệu và trao đổi với bạn học." />
    <meta property="og:url" content="https://hieudv.id.vn/" />
    <meta property="og:image" content="https://hieudv.id.vn/sqb-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Học viện SQB trên nền xanh đậm với biểu tượng quyển sách mở" />
    <script>
      window.global = window;
      try {
        const stored = localStorage.getItem('sqb-theme');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed?.state?.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
