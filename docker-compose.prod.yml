services:
  # ========================================================
  # 1. POSTGRESQL + PGVECTOR DATABASE
  # ========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sqb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sqb_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqb_postgres_data:/var/lib/postgresql/data
    networks:
      - sqb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sqb_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # 2. REDIS IN-MEMORY CACHE & DELAY QUEUE
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: sqb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - sqb_redis_data:/data
    networks:
      - sqb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # 3. ELASTICSEARCH ENGINE (FULL-TEXT SEARCH)
  # ========================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: sqb-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - sqb_es_data:/usr/share/elasticsearch/data
    networks:
      - sqb-network

  # ========================================================
  # 4. PYTHON FASTAPI AI-SIDECAR (EMBEDDINGS & BTPROP)
  # ========================================================
  ai-sidecar:
    image: ${AI_SIDECAR_IMAGE}
    container_name: sqb-ai-sidecar
    restart: unless-stopped
    environment:
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN}
      - TEXT_MODEL=${TEXT_MODEL:-intfloat/multilingual-e5-small}
      - IMAGE_MODEL=${IMAGE_MODEL:-facebook/dinov2-small}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BTPROP_MODEL=${BTPROP_MODEL:-gpt-4.1-2025-04-14}
    networks:
      - sqb-network

  # ========================================================
  # 5. SPRING BOOT BACKEND
  # ========================================================
  backend:
    image: ${BACKEND_IMAGE}
    container_name: sqb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      ai-sidecar:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Chia sẻ log đĩa cho Promtail đọc để đẩy lên Loki
      - sqb_backend_logs:/app/logs
    environment:
      # Database connection
      - DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-sqb_db}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Elasticsearch connection
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200

      # AI Services
      - AI_SIDECAR_URL=http://ai-sidecar:8000
      - AI_SERVER_URL=${AI_SERVER_URL:-http://ai-sidecar:8000}
      - AI_MODEL=${AI_MODEL:-text-embedding-3-small}

      # Cloudflare R2 Storage (Zero Object Tagging)
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_REGION=${R2_REGION:-auto}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}

      # Application Secrets & Security
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_SALT=${SECRET_SALT}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod

      # Distributed Tracing (Tempo OTLP Exporter on sqb-network)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}

      # Mail Service
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      # Firebase Push Notification (Optional: Base64 string hoặc file path)
      - FIREBASE_CREDENTIALS_BASE64=${FIREBASE_CREDENTIALS_BASE64:-}
      - FIREBASE_CONFIG_PATH=${FIREBASE_CONFIG_PATH:-}
    networks:

      - sqb-network

networks:
  sqb-network:
    name: sqb-network
    driver: bridge

volumes:
  sqb_postgres_data:
    name: sqb_postgres_data
  sqb_redis_data:
    name: sqb_redis_data
  sqb_es_data:
    name: sqb_es_data
  sqb_backend_logs:
    name: sqb_backend_logs
